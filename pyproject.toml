[project]
name = "tinytapeout-project-search"
version = "0.1.0"
description = "Keyword search across every project on every Tiny Tapeout shuttle, with per-chip breakdowns"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
tt-fetch = "ttsearch.fetch:main"
tt-build-db = "ttsearch.build_db:main"
tt-search = "ttsearch.search:main"
tt-serve = "ttsearch.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ttsearch"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
